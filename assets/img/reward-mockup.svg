<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" role="img" aria-labelledby="reward-mockup-title">
  <title id="reward-mockup-title">Illustrative mock-up of possible supporter rewards: tote bag, flyers and stickers, and a name-in-credits example</title>

  <style>
    .rm-label { font-family: "Open Sans", Arial, sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .rm-caption { font-family: "Open Sans", Arial, sans-serif; font-size: 12px; fill: #4A5A60; }
  </style>

  <!-- ==== Group 1: tote bag ($50) ==== -->
  <g transform="translate(30,20)">
    <path d="M45,55 C45,8 115,8 115,55" fill="none" stroke="#0E0705" stroke-width="7" stroke-linecap="round"/>
    <rect x="0" y="50" width="160" height="170" rx="14" fill="#EEF4F4" stroke="#C2D0D0" stroke-width="2"/>
    <text x="80" y="125" text-anchor="middle" class="rm-label" fill="#E88C33">THE TUNA</text>
    <text x="80" y="145" text-anchor="middle" class="rm-label" fill="#E88C33">TRUTH</text>
    <text x="80" y="163" text-anchor="middle" class="rm-caption" fill="#10CBB2" font-weight="700" font-size="12">with Serena Appleby</text>
    <line x1="0" y1="85" x2="160" y2="85" stroke="#C2D0D0" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>
  <text x="110" y="268" text-anchor="middle" class="rm-caption">$50 — tote bag</text>
  <text x="110" y="284" text-anchor="middle" class="rm-caption">(illustrative only)</text>

  <!-- ==== Group 2: flyers + stickers ($200) ==== -->
  <g transform="translate(260,20)">
    <rect x="0" y="20" width="120" height="80" rx="6" fill="#FFFFFF" stroke="#C2D0D0" stroke-width="2" transform="rotate(-6 60 60)"/>
    <rect x="10" y="14" width="120" height="80" rx="6" fill="#FFFFFF" stroke="#C2D0D0" stroke-width="2" transform="rotate(-1 70 54)"/>
    <rect x="20" y="10" width="120" height="80" rx="6" fill="#F6AE2D" fill-opacity="0.12" stroke="#F6AE2D" stroke-width="2" transform="rotate(4 80 50)"/>
    <line x1="40" y1="34" x2="120" y2="34" stroke="#4A5A60" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="46" x2="105" y2="46" stroke="#C2D0D0" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="58" x2="110" y2="58" stroke="#C2D0D0" stroke-width="3" stroke-linecap="round"/>

    <circle cx="25" cy="150" r="26" fill="#10CBB2"/>
    <path d="M12,150 q13,-16 26,0 q-13,16 -26,0 Z" fill="#0A1416" opacity="0.85"/>
    <circle cx="85" cy="162" r="20" fill="#F6AE2D"/>
    <text x="85" y="167" text-anchor="middle" class="rm-caption" font-weight="700" fill="#241300" font-size="13">TT</text>
  </g>
  <text x="340" y="268" text-anchor="middle" class="rm-caption">$200 — flyers &amp; stickers</text>
  <text x="340" y="284" text-anchor="middle" class="rm-caption">(illustrative only)</text>

  <!-- ==== Group 3: name in credits ($500) ==== -->
  <g transform="translate(90,330)">
    <rect x="0" y="0" width="300" height="130" rx="8" fill="#0A1416"/>
    <g fill="#EEF4F4" opacity="0.5">
      <rect x="12" y="10" width="9" height="9" rx="1"/>
      <rect x="12" y="111" width="9" height="9" rx="1"/>
      <rect x="279" y="10" width="9" height="9" rx="1"/>
      <rect x="279" y="111" width="9" height="9" rx="1"/>
    </g>
    <text x="150" y="52" text-anchor="middle" class="rm-caption" fill="#B9CBCE" letter-spacing="0.12em" font-size="13">WITH THANKS TO</text>
    <text x="150" y="84" text-anchor="middle" class="rm-label" fill="#F6AE2D" font-size="20">[ YOUR NAME ]</text>
  </g>
  <text x="240" y="490" text-anchor="middle" class="rm-caption">$500 — name-in-credits example</text>
  <text x="240" y="506" text-anchor="middle" class="rm-caption">(placeholder name, not final layout)</text>

</svg>
