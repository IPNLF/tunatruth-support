<!-- ACCESSIBILITY (2026-09-22, from review): header/main/footer are now
     three separate mount points, not one flat #app div, so <header>
     and <footer> (rendered by TT.header()/TT.footer()) stay TOP-LEVEL
     siblings of <main> rather than descendants of it — nesting them
     inside <main> would have silently stripped their implicit
     "banner"/"contentinfo" landmark roles. -->
<noscript>
  <!-- ACCESSIBILITY (2026-09-22, from review): "the entire donation
       interface depends on JavaScript rendering successfully" — this
       covers the JS-disabled case with real, working Stripe links.
       It does NOT cover "JS enabled but a script throws" — the only
       full fix for that is pre-rendering the HTML (a build step),
       which is a bigger architecture change than today's scope; see
       README. These links are duplicated from config.js by hand —
       if the amounts/URLs there ever change, update here too. -->
  <div style="max-width:640px;margin:40px auto;padding:0 24px;font-family:Arial,sans-serif;color:#1E2A2E;">
    <h1>The Tuna Truth — Support the documentary</h1>
    <p>This page works best with JavaScript enabled, but you can still donate directly via Stripe:</p>

      <li><a href="https://donate.stripe.com/5kQ4gzdxj7G1ekfdK797G01">Donate $200</a></li>
      <li><a href="https://donate.stripe.com/00wdR9dxjd0ldgb9tR97G06">Donate $500</a></li>
      <li><a href="https://donate.stripe.com/aFa9AT0Kx2lHb836hF97G05">Choose your own amount</a></li>
    </ul>
  </div>
</noscript>

</script>
